<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Admin Kedamazbuth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --sunk:#E3E9E6; --ink:#17201E; --muted:#56645E; --line:#D3DCD8;
  --accent:#0E5E57; --accent-ink:#FFFFFF; --focus:#1D8A7F;
  --wait:#875800; --wait-bg:#FBEFD3; --paid:#1D6A41; --paid-bg:#DCEFE3;
  --sent:#0E5E57; --sent-bg:#D6EBE8; --rej:#9B2E27; --rej-bg:#F6DDDA;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111816; --surface:#19221F; --sunk:#141C1A; --ink:#E4ECE9; --muted:#97A6A0; --line:#2A3632;
    --accent:#5CC0B3; --accent-ink:#0A1714; --focus:#7FD6CB;
    --wait:#F0C46A; --wait-bg:#3A2E14; --paid:#7FD39F; --paid-bg:#173325;
    --sent:#5CC0B3; --sent-bg:#143430; --rej:#F29A92; --rej-bg:#3D1C19;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
a{color:var(--accent)}

/* Login */
.login{min-height:100%;display:grid;place-items:center;padding:24px}
.login form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px}
.login h1{font-size:22px;line-height:1.25;margin:0 0 4px;font-weight:700}
.login p{margin:0 0 20px;color:var(--muted)}
.login label{display:block;font-weight:600;margin-bottom:6px}
.field{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:9px;border:1px solid transparent;font-weight:600;text-decoration:none}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-quiet{background:transparent;border-color:var(--line);color:var(--ink)}
.btn:disabled{opacity:.55;cursor:default}
.login .btn{width:100%;margin-top:16px}
.err{color:var(--rej);margin:12px 0 0;min-height:1.5em}

/* App shell */
.app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.top h1{font-size:17px;margin:0;font-weight:700;flex:1}
.top h1 small{display:block;font-size:13px;font-weight:400;color:var(--muted)}
.layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,380px) 1fr}
.list-pane{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--surface)}
.filters{display:flex;gap:6px;padding:12px 14px 8px;overflow-x:auto;scrollbar-width:none}
.filters button{flex:none;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:14px;white-space:nowrap}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.filters .n{opacity:.7;margin-left:4px}
.search{padding:4px 14px 12px;border-bottom:1px solid var(--line)}
.orders{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1}
.orders li+li{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;padding:12px 16px;background:none;border:0;border-left:3px solid transparent}
.row[aria-current="true"]{background:var(--sunk);border-left-color:var(--accent)}
.row .who{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{font-weight:600}
.row .sub{color:var(--muted);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty-list{padding:28px 18px;color:var(--muted)}

.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600}
.s-menunggu{color:var(--wait);background:var(--wait-bg)}
.s-lunas{color:var(--paid);background:var(--paid-bg)}
.s-terkirim{color:var(--sent);background:var(--sent-bg)}
.s-ditolak{color:var(--rej);background:var(--rej-bg)}

/* Detail */
.detail{overflow-y:auto;min-height:0;padding:24px clamp(16px,3vw,36px) 48px}
.placeholder{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px}
.back{display:none;margin-bottom:14px}
.d-head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:14px 24px;margin-bottom:22px}
.d-head h2{font-size:24px;line-height:1.2;margin:0 0 4px;font-weight:700}
.meta{margin:0;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500}
.seg button[aria-pressed="true"]{border-color:currentColor;font-weight:700}
.seg button[aria-pressed="false"]{color:var(--ink);background:var(--surface)}

.amount{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 14px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
.amount span{color:var(--muted)}
.amount strong{font-size:clamp(28px,4vw,38px);line-height:1.1;font-weight:700;letter-spacing:-.01em}
.amount .code{background:var(--wait-bg);color:var(--wait);border-radius:6px;padding:0 4px;margin-left:1px}
.amount .hint{flex-basis:100%;font-size:13.5px}

.proofs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:26px}
.proof{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.proof figcaption{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;font-weight:600;border-bottom:1px solid var(--line)}
.proof figcaption a{font-weight:500;font-size:14px}
.slot{flex:1;min-height:260px;display:grid;place-items:center;background:var(--sunk)}
.slot img{display:block;width:100%;max-height:68vh;object-fit:contain;cursor:zoom-in}
.slot p{color:var(--muted);margin:0;padding:20px;text-align:center}

.facts{display:grid;grid-template-columns:max-content 1fr;gap:10px 22px;margin:0 0 26px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;overflow-wrap:anywhere}
.facts dd a{margin-left:10px;font-size:14px}

.notes label{display:block;font-weight:600;margin-bottom:6px}
.notes textarea{width:100%;min-height:84px;resize:vertical;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.notes .btn{margin-top:8px}

.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.86);display:grid;place-items:center;padding:20px;z-index:20}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
.lightbox button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;background:#fff;color:#111;border:0;border-radius:9px;padding:8px 14px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:500;z-index:30;max-width:calc(100% - 32px)}

@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .list-pane{border-right:0}
  .detail{display:none}
  body.viewing .list-pane{display:none}
  body.viewing .detail{display:block}
  .back{display:inline-flex}
  .proofs{grid-template-columns:1fr}
  .facts{grid-template-columns:1fr;gap:2px}
  .facts dd{margin-bottom:10px}
}
@media (prefers-reduced-motion:no-preference){
  .row{transition:background .12s}
}
</style>
</head>
<body>

<main class="login" id="login">
  <form id="loginForm" autocomplete="on">
    <h1>Admin Kedamazbuth</h1>
    <p>Masuk untuk melihat pesanan dan bukti pembayaran.</p>
    <label for="pw">Password</label>
    <input class="field" id="pw" type="password" autocomplete="current-password" required>
    <button class="btn btn-primary" type="submit" id="loginBtn">Masuk</button>
    <p class="err" id="loginErr" role="alert"></p>
  </form>
</main>

<div class="app" id="app" hidden>
  <header class="top">
    <h1>Pesanan e-book<small id="lastSync">Belum dimuat</small></h1>
    <button class="btn btn-quiet" type="button" id="refreshBtn">Muat ulang</button>
    <button class="btn btn-quiet" type="button" id="logoutBtn">Keluar</button>
  </header>
  <div class="layout">
    <aside class="list-pane" aria-label="Daftar pesanan">
      <div class="filters" id="filters" role="group" aria-label="Saring status"></div>
      <div class="search"><input class="field" id="q" type="search" placeholder="Cari nama, Instagram, atau no. invoice" aria-label="Cari pesanan"></div>
      <ul class="orders" id="orders"></ul>
    </aside>
    <section class="detail" id="detail" aria-live="polite">
      <div class="placeholder"><p>Pilih pesanan di sebelah kiri untuk melihat datanya dan bukti pembayarannya.</p></div>
    </section>
  </div>
</div>

<div class="lightbox" id="lightbox" hidden role="dialog" aria-label="Gambar diperbesar">
  <img id="lightImg" alt="">
  <button type="button" id="lightClose">Tutup</button>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
// Tempel URL web app Google Apps Script di sini (berakhiran /exec).
const API_URL = 'https://script.google.com/macros/s/AKfycbzj1uoiUz_yyPk6yKiS9_bgHB74zy2BVl-u0C0SJVt5kvb6wyi3Ip923VCV0WicnhM/exec';

const STATUS = { menunggu: 'Perlu dicek', lunas: 'Lunas', terkirim: 'E-book terkirim', ditolak: 'Ditolak' };
const FILTERS = [['menunggu', 'Perlu dicek'], ['lunas', 'Lunas'], ['terkirim', 'Terkirim'], ['ditolak', 'Ditolak'], ['semua', 'Semua']];

const $ = id => document.getElementById(id);
let token = store('get');
let orders = [], filter = 'menunggu', query = '', selectedId = null, lastLoad = 0;
const fileCache = new Map();

function store(op, v) {
  try {
    if (op === 'get') return sessionStorage.getItem('kdz_admin') || '';
    if (op === 'set') sessionStorage.setItem('kdz_admin', v);
    if (op === 'del') sessionStorage.removeItem('kdz_admin');
  } catch (e) {}
  return '';
}

async function api(action, payload = {}) {
  if (API_URL.indexOf('TEMPEL') === 0) throw new Error('URL backend belum diisi. Buka admin.html dan isi API_URL.');
  let res;
  try {
    res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action, token }, payload)) });
  } catch (e) {
    throw new Error('Tidak bisa menghubungi server. Periksa koneksi internet.');
  }
  const data = await res.json().catch(() => ({ ok: false, error: 'Balasan server tidak terbaca.' }));
  if (!data.ok) {
    if (data.auth && action !== 'login') showLogin(data.error);
    throw new Error(data.error || 'Permintaan gagal.');
  }
  return data;
}

/* ---------- Login ---------- */
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('loginBtn');
  btn.disabled = true; btn.textContent = 'Memeriksa…'; $('loginErr').textContent = '';
  try {
    const r = await api('login', { password: $('pw').value });
    token = r.token; store('set', token); $('pw').value = '';
    showApp();
  } catch (err) {
    $('loginErr').textContent = err.message;
  } finally {
    btn.disabled = false; btn.textContent = 'Masuk';
  }
});

function showLogin(msg) {
  token = ''; store('del');
  orders = []; fileCache.clear(); selectedId = null;
  $('app').hidden = true; $('login').hidden = false;
  $('loginErr').textContent = msg || '';
  $('pw').focus();
}

function showApp() {
  $('login').hidden = true; $('app').hidden = false;
  load();
}

$('logoutBtn').addEventListener('click', async () => {
  try { await api('logout'); } catch (e) {}
  showLogin('');
});

/* ---------- Data ---------- */
async function load() {
  const btn = $('refreshBtn');
  btn.disabled = true; btn.textContent = 'Memuat…';
  try {
    const r = await api('list');
    orders = r.orders;
    lastLoad = Date.now();
    $('lastSync').textContent = 'Diperbarui ' + new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    renderList();
    if (selectedId) {
      const o = orders.find(x => x.id === selectedId);
      if (o) renderDetail(o, true);
    }
  } catch (err) {
    if (token) toast(err.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Muat ulang';
  }
}
$('refreshBtn').addEventListener('click', load);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && token && Date.now() - lastLoad > 60000) load();
});

/* ---------- Daftar ---------- */
function renderList() {
  const counts = { semua: orders.length };
  orders.forEach(o => { counts[o.status] = (counts[o.status] || 0) + 1; });
  $('filters').innerHTML = FILTERS.map(([k, label]) =>
    `<button type="button" data-f="${k}" aria-pressed="${filter === k}">${label}<span class="n">${counts[k] || 0}</span></button>`
  ).join('');

  const q = query.trim().toLowerCase();
  const list = orders.filter(o =>
    (filter === 'semua' || o.status === filter) &&
    (!q || [o.nama, o.instagram, o.invoice, o.email, o.whatsapp].join(' ').toLowerCase().includes(q))
  );

  if (!list.length) {
    $('orders').innerHTML = `<li class="empty-list">${q ? 'Tidak ada pesanan yang cocok dengan pencarian ini.'
      : filter === 'menunggu' ? 'Semua pesanan sudah dicek.' : 'Belum ada pesanan dengan status ini.'}</li>`;
    return;
  }
  $('orders').innerHTML = list.map(o => `
    <li><button type="button" class="row" data-id="${esc(o.id)}" aria-current="${o.id === selectedId}">
      <span class="who">${esc(o.nama)}</span><span class="amt">${rupiah(o.nominal)}</span>
      <span class="sub">@${esc(o.instagram)} · ${fmtTime(o.waktu, true)}</span>
      <span><span class="chip s-${o.status}">${STATUS[o.status]}</span></span>
    </button></li>`).join('');
}

$('filters').addEventListener('click', e => {
  const b = e.target.closest('[data-f]'); if (!b) return;
  filter = b.dataset.f; renderList();
});
$('q').addEventListener('input', e => { query = e.target.value; renderList(); });
$('orders').addEventListener('click', e => {
  const b = e.target.closest('[data-id]'); if (!b) return;
  const o = orders.find(x => x.id === b.dataset.id); if (!o) return;
  selectedId = o.id;
  document.body.classList.add('viewing');
  renderList(); renderDetail(o);
  $('detail').scrollTop = 0;
});

/* ---------- Detail ---------- */
function renderDetail(o, keepNote) {
  const noteDraft = keepNote && $('note') ? $('note').value : null;
  const wa = waLink(o.whatsapp);
  $('detail').innerHTML = `
    <button class="btn btn-quiet back" type="button" data-act="back">Kembali ke daftar</button>
    <div class="d-head">
      <div>
        <h2>${esc(o.nama)}</h2>
        <p class="meta"><span>${esc(o.invoice)}</span><span>${fmtTime(o.waktu)}</span></p>
      </div>
      <div class="seg" role="group" aria-label="Ubah status pesanan">
        ${Object.keys(STATUS).map(s => `<button type="button" data-status="${s}" class="${o.status === s ? 's-' + s : ''}" aria-pressed="${o.status === s}">${STATUS[s]}</button>`).join('')}
      </div>
    </div>

    <div class="amount">
      <span>Nominal yang harus masuk</span>
      <strong>${amountHTML(o.nominal)}</strong>
      <span class="hint">Cocokkan dengan bukti transfer, termasuk 3 digit terakhir.</span>
    </div>

    <div class="proofs">
      <figure class="proof">
        <figcaption><span>Bukti transfer</span><a data-drive="transfer" target="_blank" rel="noopener" hidden>Buka di Drive</a></figcaption>
        <div class="slot" data-slot="transfer"><p>Memuat gambar…</p></div>
      </figure>
      <figure class="proof">
        <figcaption><span>Foto invoice</span><a data-drive="invoice" target="_blank" rel="noopener" hidden>Buka di Drive</a></figcaption>
        <div class="slot" data-slot="invoice"><p>Memuat gambar…</p></div>
      </figure>
    </div>

    <dl class="facts">
      <dt>Instagram</dt><dd>@${esc(o.instagram)}<a href="https://ig.me/m/${encodeURIComponent(o.instagram)}" target="_blank" rel="noopener">Buka DM</a></dd>
      <dt>WhatsApp</dt><dd>${esc(o.whatsapp) || '–'}${wa ? `<a href="${wa}" target="_blank" rel="noopener">Chat</a>` : ''}</dd>
      <dt>Email</dt><dd>${o.email ? `${esc(o.email)}<a href="mailto:${encodeURIComponent(o.email)}">Kirim email</a>` : '–'}</dd>
      <dt>Kekeluargaan</dt><dd>${esc(o.kekeluargaan) || '–'}</dd>
      <dt>Produk</dt><dd>${esc(o.produk) || '–'}</dd>
      <dt>Watermark</dt><dd>${esc(o.nama)}</dd>
    </dl>

    <div class="notes">
      <label for="note">Catatan untuk diri sendiri</label>
      <textarea id="note" placeholder="Misalnya: transfer dari rekening atas nama orang tua.">${esc(noteDraft !== null ? noteDraft : o.catatan)}</textarea>
      <button class="btn btn-quiet" type="button" data-act="save-note">Simpan catatan</button>
    </div>`;
  loadFiles(o.id);
}

async function loadFiles(id) {
  let f = fileCache.get(id);
  if (!f) {
    try { f = await api('files', { id }); fileCache.set(id, f); }
    catch (err) {
      if (selectedId === id) document.querySelectorAll('[data-slot]').forEach(s => s.innerHTML = `<p>${esc(err.message)}</p>`);
      return;
    }
  }
  if (selectedId !== id) return;
  fillSlot('transfer', f.transfer, 'Bukti transfer');
  fillSlot('invoice', f.invoice, 'Foto invoice');
}

function fillSlot(key, file, label) {
  const slot = document.querySelector(`[data-slot="${key}"]`);
  const link = document.querySelector(`[data-drive="${key}"]`);
  if (!slot) return;
  if (!file) { slot.innerHTML = '<p>Gambar tidak ditemukan di Google Drive. Mungkin sudah dihapus.</p>'; return; }
  slot.innerHTML = `<img src="data:${file.type};base64,${file.data}" alt="${label}">`;
  if (link) { link.href = file.url; link.hidden = false; }
}

$('detail').addEventListener('click', async e => {
  const img = e.target.closest('.slot img');
  if (img) { $('lightImg').src = img.src; $('lightImg').alt = img.alt; $('lightbox').hidden = false; $('lightClose').focus(); return; }

  if (e.target.closest('[data-act="back"]')) { closeDetail(); return; }

  const sb = e.target.closest('[data-status]');
  if (sb) {
    const o = orders.find(x => x.id === selectedId); if (!o || o.status === sb.dataset.status) return;
    const btns = document.querySelectorAll('[data-status]'); btns.forEach(b => b.disabled = true);
    try {
      await api('update', { id: o.id, status: sb.dataset.status });
      o.status = sb.dataset.status;
      renderList(); renderDetail(o, true);
      toast('Status diubah: ' + STATUS[o.status]);
    } catch (err) { toast(err.message); btns.forEach(b => b.disabled = false); }
    return;
  }

  const nb = e.target.closest('[data-act="save-note"]');
  if (nb) {
    const o = orders.find(x => x.id === selectedId); if (!o) return;
    nb.disabled = true;
    try {
      await api('update', { id: o.id, catatan: $('note').value });
      o.catatan = $('note').value;
      toast('Catatan disimpan');
    } catch (err) { toast(err.message); }
    nb.disabled = false;
  }
});

function closeDetail() {
  document.body.classList.remove('viewing');
  selectedId = null;
  $('detail').innerHTML = '<div class="placeholder"><p>Pilih pesanan di sebelah kiri untuk melihat datanya dan bukti pembayarannya.</p></div>';
  renderList();
}

/* ---------- Lightbox & toast ---------- */
function closeLight() { $('lightbox').hidden = true; $('lightImg').src = ''; }
$('lightClose').addEventListener('click', closeLight);
$('lightbox').addEventListener('click', e => { if (e.target === $('lightbox')) closeLight(); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('lightbox').hidden) closeLight();
  else if (document.body.classList.contains('viewing')) closeDetail();
});

let toastTimer;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 3200);
}

/* ---------- Format ---------- */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function rupiah(n) { return 'Rp' + Number(n || 0).toLocaleString('id-ID'); }
function amountHTML(n) {
  const s = rupiah(n);
  if (n < 1000) return esc(s);
  return esc(s.slice(0, -3)) + '<span class="code" title="Kode unik">' + esc(s.slice(-3)) + '</span>';
}
function fmtTime(iso, short) {
  const d = new Date(iso); if (isNaN(d)) return esc(iso);
  return d.toLocaleString('id-ID', short
    ? { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }
    : { dateStyle: 'medium', timeStyle: 'short' });
}
function waLink(n) {
  let d = String(n || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.startsWith('0')) d = '62' + d.slice(1);
  return 'https://wa.me/' + d;
}
